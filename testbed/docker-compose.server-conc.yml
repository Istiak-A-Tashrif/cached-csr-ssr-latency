# Item 6 (concurrency) on server: each queueing station gets ONE dedicated core (cpuset),
# not a CFS quota (quota throttling changes capacity under load, which MVA cannot express).
#   core 1: client (all browsers)   core 2: web + api + redis   core 3: postgres
# Core 0 is left to the host and the live co-hosted production apps; our peak stays at 3 cores.
# Used as: COMPOSE_FILE=docker-compose.yml:docker-compose.server-conc.yml (no published ports).
services:
  db:
    cpuset: "3"
    mem_limit: 768m
  redis:
    cpuset: "2"
    mem_limit: 256m
  api:
    cpuset: "2"
    mem_limit: 512m
  web:
    cpuset: "2"
    mem_limit: 1g
  client:
    cpuset: "1"
    mem_limit: 2g
  controller:
    build: { context: ./controller }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    environment:
      COMPOSE_FILE: docker-compose.yml:docker-compose.server-conc.yml
    network_mode: host
    command: ["sleep", "infinity"]
    cpuset: "0"
    cpus: 0.25
    mem_limit: 256m
